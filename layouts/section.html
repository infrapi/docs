{{ define "main" }}
<section class="page-hero">
  <div class="glow" aria-hidden="true"></div>
  <div class="wrap">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="lead">{{ . }}</p>{{ end }}
  </div>
</section>
<section class="section section--tight">
  <div class="wrap">
    {{ with .Content }}<div class="prose prose--narrow">{{ . }}</div>{{ end }}
    <div class="card-grid card-grid--3">
      {{ range .Pages.ByWeight }}
      <a class="card card--link" href="{{ .RelPermalink }}"><h3>{{ .Title }}</h3><p>{{ .Description }}</p></a>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
