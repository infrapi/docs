{{ $repo := .repo | default "" }}
<section class="cta">
  <div class="wrap cta-inner">
    <div>
      <h2>{{ .title | default "Open source, MIT licensed" }}</h2>
      <p>{{ .text | default "Every InfraPI product is developed in the open. Use it, fork it, open an issue or send a pull request." }}</p>
    </div>
    <div class="actions">
      <a class="btn btn--primary" href="{{ if $repo }}https://github.com/{{ $repo }}{{ else }}{{ site.Params.github }}{{ end }}">{{ partial "icon.html" "github" }} View on GitHub</a>
      <a class="btn btn--ghost" href="{{ "learn/" | relURL }}">Start learning</a>
    </div>
  </div>
</section>
