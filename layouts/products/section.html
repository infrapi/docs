{{ define "main" }}
<section class="page-hero">
  <div class="glow" aria-hidden="true"></div>
  <div class="wrap">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="lead">{{ . }}</p>{{ end }}
  </div>
</section>
<section class="section section--tight">
  <div class="wrap">
    <div class="card-grid card-grid--products">
      {{ partial "product-cards.html" . }}
    </div>
  </div>
</section>
{{ end }}
