name: Publish

on:
  push:
    branches: [main]
  pull_request:
  # sent by a product repository's notify-docs workflow when its docs/ change
  repository_dispatch:
    types: [docs-updated]
  # safety net for a missed dispatch
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.169.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Each product's docs/ only, at the tip of main. Public repositories:
      # no token needed. For a private one, add `token: ${{ secrets.... }}`.
      - name: Check out kayra docs
        uses: actions/checkout@v7
        with: { repository: infrapi/kayra, path: _repos/kayra, sparse-checkout: docs }
      - name: Check out tofu-api docs
        uses: actions/checkout@v7
        with: { repository: infrapi/tofu-api, path: _repos/tofu-api, sparse-checkout: docs }
      - name: Check out lib docs
        uses: actions/checkout@v7
        with: { repository: infrapi/lib, path: _repos/lib, sparse-checkout: docs }

      - name: Install Hugo
        run: |
          mkdir -p "$RUNNER_TEMP/hugo"
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/hugo" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      # --panicOnWarning: a broken link or anchor in any product's docs fails
      # the build (see layouts/_markup/render-link.html).
      - name: Build
        run: |
          hugo --gc --minify --panicOnWarning \
            ${{ steps.pages.outputs.base_url && format('--baseURL {0}/', steps.pages.outputs.base_url) || '' }}

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  # Requires Settings > Pages > Source = "GitHub Actions".
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
