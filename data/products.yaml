# One entry per product. Drives the landing page, the navigation, the hub
# pages and the docs pages' "edit on GitHub" links.
order: [kayra, tofu-api, ulgen, lib]
# the Docs menus: the products', then docs that are not a product's
docs: [kayra, cli, tofu-api, ulgen, lib]

items:
  kayra:
    name: Kayra
    repo: infrapi/kayra
    branch: main
    version: v0.3   # fallback only: the portal shows the latest GitHub release
    status: preview
    icon: shield
    tagline: Identity, namespaces and RBAC for your platform.
    summary: Who callers are, which tenant they act in, what they may do there, and which APIs each tenant is subscribed to.

  tofu-api:
    name: tofu-api
    repo: infrapi/tofu-api
    branch: main
    version: v0.6   # fallback only: the portal shows the latest GitHub release
    status: early
    icon: api
    tagline: Any OpenTofu provider as a REST API, and as MCP tools for AI agents.
    summary: An OpenAPI contract generated from the provider's schemas, MCP tools generated from the contract, rules in one YAML file per provider, no code per resource.

  ulgen:
    name: ulgen
    repo: infrapi/ulgen
    branch: main
    version: v0.3   # fallback only: the portal shows the latest GitHub release
    status: early
    icon: agent
    tagline: One MCP endpoint for AI agents, authorized per tenant by Kayra.
    summary: Several MCP servers behind one endpoint, every tool scoped to a tenant, every call checked against Kayra and made with the tenant's credential.

  lib:
    name: lib
    repo: infrapi/lib
    branch: main
    version: v0.11   # fallback only: the portal shows the latest GitHub release
    status: preview
    icon: blocks
    tagline: The Go foundation of every InfraPI service.
    summary: URL layout, auth, contract enforcement, RFC 9457 errors, MCP for AI agents, metrics, tracing and Vault, shared by every service.

  # infrapi-cli: docs only for now (in `docs`, not in `order`), no hub
  # page; release: false until infrapi/cli has a first GitHub release
  cli:
    name: cli
    repo: infrapi/cli
    branch: main
    version: main
    release: false
    hub: false
    status: preview
    icon: terminal
    tagline: InfraPI's command line.
    summary: Log in to Kayra and call its API, create an API project and grow it from its contract, and run a local dev stack, from one binary, infrapi-cli.
